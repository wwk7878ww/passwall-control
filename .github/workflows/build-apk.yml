name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent APK signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_BASE64" ] || [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "::error::Please configure both ANDROID_SIGNING_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD in repository Settings > Secrets and variables > Actions. See SIGNING_SETUP.md"
            exit 1
          fi
          mkdir -p .android-signing
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > .android-signing/passwall-upload-key.p12
          chmod 600 .android-signing/passwall-upload-key.p12
          keytool -list -keystore .android-signing/passwall-upload-key.p12 -storetype PKCS12 -alias passwall-control -storepass "$ANDROID_SIGNING_PASSWORD" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Patch Java text block escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/wangkai/passwallcontrol/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace("location.pathname.replace(/\\/$/,''); var want=TARGET_PATH.replace(/\\/$/,'');",
                        "location.pathname.replace(/\\\\/$/,''); var want=TARGET_PATH.replace(/\\\\/$/,'');")
          s = s.replace("replace(/\\s/g,'')", "replace(/\\\\s/g,'')")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: passwall-control-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
