plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wangkai.passwallcontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wangkai.passwallcontrol'
        minSdk 23
        targetSdk 35
        // The GitHub Actions run number always increases between release builds.
        versionCode = (System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 3)
        versionName = "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '3'}"
    }

    signingConfigs {
        stable {
            // The key is restored from GitHub Actions Secrets; never commit it.
            storeFile = file('../.android-signing/passwall-upload-key.p12')
            storePassword = System.getenv('ANDROID_SIGNING_PASSWORD') ?: ''
            keyAlias = 'passwall-control'
            keyPassword = System.getenv('ANDROID_SIGNING_PASSWORD') ?: ''
            storeType = 'PKCS12'
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.stable
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
